<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 664" width="1280" height="664" role="img" aria-label="Dependencies between the source documents. Land and lease, town planning and site-specific controls all lead to building plan approval under the Buildings Ordinance, Cap. 123, as do the design regulations and codes. Cost and contract, construction and after-completion documents follow in practice."><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6b7682"/></marker></defs><rect width="1280" height="664" rx="14" fill="#f6f7f8"/><text x="28" y="44" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700">How the source documents depend on each other</text><text x="28" y="72" fill="#3d4a58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400">Most of them lead to building plan approval under the Buildings Ordinance.</text><path d="M420 170 C456 170 456 196 490 196" fill="none" stroke="#6b7682" stroke-width="2.2" marker-end="url(#a)"/><path d="M420 319 C456 319 456 232 490 232" fill="none" stroke="#6b7682" stroke-width="2.2" marker-end="url(#a)"/><path d="M420 486 C462 486 452 262 494 256" fill="none" stroke="#6b7682" stroke-width="2.2" marker-end="url(#a)"/><path d="M660 332 L660 288" fill="none" stroke="#6b7682" stroke-width="2.2" marker-end="url(#a)"/><path d="M828 196 C864 196 864 158 898 158" fill="none" stroke="#6b7682" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a)"/><path d="M828 220 C864 220 864 306 898 306" fill="none" stroke="#6b7682" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a)"/><path d="M828 244 C856 244 860 464 898 464" fill="none" stroke="#6b7682" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a)"/><rect x="28" y="96" width="392" height="148" rx="10" fill="#fff" stroke="#d9dde1"/><rect x="28" y="96" width="392" height="7" rx="3.5" fill="#2f7bd9"/><text x="46" y="128" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700">Land and lease</text><text x="46" y="153" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">Basic Law 120-123, Cap. 124, Cap. 150, Cap. 515,</text><text x="46" y="174" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">Cap. 648, LAO PN 3/2020 and 3/2020A</text><text x="46" y="198" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">Cap. 648 s.13: extended leases carry covenants</text><text x="46" y="217" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">to comply with the BO and Cap. 131.</text><rect x="28" y="258" width="392" height="132" rx="10" fill="#fff" stroke="#d9dde1"/><rect x="28" y="258" width="392" height="7" rx="3.5" fill="#ea6a34"/><text x="46" y="290" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700">Town planning</text><text x="46" y="315" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">Cap. 131, TPB PG-30D, 31B, 35E, 36C,</text><text x="46" y="336" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">Rural Covering Notes</text><text x="46" y="360" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">Breach of a plan is a ground to refuse building plans</text><text x="46" y="379" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">(BO s.16(1)(d), as cited in Cap. 131 s.16(7)).</text><rect x="28" y="404" width="392" height="178" rx="10" fill="#fff" stroke="#d9dde1"/><rect x="28" y="404" width="392" height="7" rx="3.5" fill="#1fae7a"/><text x="46" y="436" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700">Site-specific controls</text><text x="46" y="461" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">Railways: Cap. 519, Cap. 276, PNAP APP-24</text><text x="46" y="482" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">New Territories: Cap. 121</text><text x="46" y="503" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">Environmental impact: Cap. 499</text><text x="46" y="527" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">BA may control works near railways (s.27, s.15).</text><text x="46" y="546" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">Cap. 499 s.9(1) needs its own permit. It is a</text><text x="46" y="565" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">separate gate, not a Buildings Department step.</text><rect x="492" y="136" width="336" height="150" rx="10" fill="#fff5f2" stroke="#c5301c" stroke-width="2" stroke-dasharray="7 5"/><text x="510" y="168" fill="#c5301c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700">Buildings Ordinance, Cap. 123</text><text x="510" y="193" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">Building plan approval and consent</text><text x="510" y="214" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">Cap. 123A sets the submission procedure</text><text x="510" y="238" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">Most documents cite it, but neither text is</text><text x="510" y="257" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">in the local library yet.</text><rect x="492" y="334" width="336" height="248" rx="10" fill="#fff" stroke="#d9dde1"/><rect x="492" y="334" width="336" height="7" rx="3.5" fill="#e9a319"/><text x="510" y="366" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700">Design rules under it</text><text x="510" y="391" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">Cap. 123F planning, Cap. 123Q construction</text><text x="510" y="412" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">FS Code 2011 and Minimum FSI Code</text><text x="510" y="433" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">(these two codes cite each other)</text><text x="510" y="454" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">Building Energy Code, under Cap. 610</text><text x="510" y="478" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">The BA may refuse plans without an FSD</text><text x="510" y="497" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">certificate (BO s.16(1)(b), as cited in the</text><text x="510" y="516" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">Minimum FSI Code para 1.4).</text><rect x="900" y="96" width="352" height="124" rx="10" fill="#fff" stroke="#d9dde1"/><rect x="900" y="96" width="352" height="7" rx="3.5" fill="#7559a8"/><text x="918" y="128" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700">Cost and contract</text><text x="918" y="153" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">Arcadis cost review, SFBC 2025</text><text x="918" y="177" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">Follows the design in practice. The contract</text><text x="918" y="196" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">does not name the Buildings Ordinance.</text><rect x="900" y="234" width="352" height="148" rx="10" fill="#fff" stroke="#d9dde1"/><rect x="900" y="234" width="352" height="7" rx="3.5" fill="#7559a8"/><text x="918" y="266" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700">Construction and completion</text><text x="918" y="291" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">Cap. 618 lifts and escalators</text><text x="918" y="315" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">Cap. 123Q and the Building Energy Code</text><text x="918" y="334" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">borrow its definitions. Permits are needed</text><text x="918" y="353" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">before lifts come into use.</text><rect x="900" y="396" width="352" height="186" rx="10" fill="#fff" stroke="#d9dde1"/><rect x="900" y="396" width="352" height="7" rx="3.5" fill="#7559a8"/><text x="918" y="428" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700">After completion</text><text x="918" y="453" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">Cap. 344 building management</text><text x="918" y="474" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">Cap. 123N minor works</text><text x="918" y="495" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">Cap. 123P building inspection</text><text x="918" y="519" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">The FS Code requires fire safety conditions</text><text x="918" y="538" fill="#5a6673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">to go into the Deed of Mutual Covenant.</text><text x="28" y="618" fill="#3d4a58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">Solid arrow: stated in the documents. Dashed arrow: practice order, for an AP to confirm. Red dashed box: not in the local library.</text><text x="28" y="642" fill="#3d4a58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">Throughout: HKIA Code of Professional Conduct. Not part of this flow: Cap. 406 Electricity Ordinance. Draft for AP review, not legal advice.</text></svg>
