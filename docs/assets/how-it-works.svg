<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="How it works: describe the project in JSON, run the checks, get draft outputs, then an Authorized Person reviews and signs."><rect width="1280" height="300" rx="14" fill="#f6f7f8"/><rect x="24" y="28" width="280" height="244" rx="10" fill="#fff" stroke="#d9dde1"/><rect x="24" y="28" width="280" height="8" rx="4" fill="#2f7bd9"/><text x="44" y="78" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700">1  Describe the project</text><text x="44" y="112" fill="#2f7bd9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700">project.json</text><text x="44" y="156" fill="#3d4a58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17">Site, street widths, floors</text><text x="44" y="188" fill="#3d4a58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17">Rooms, exits, lease, OZP</text><text x="44" y="220" fill="#3d4a58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17">Contract and BD dates</text><path d="M307 150h14m-6 -6l6 6l-6 6" fill="none" stroke="#6b7682" stroke-width="2.5"/><rect x="328" y="28" width="280" height="244" rx="10" fill="#fff" stroke="#d9dde1"/><rect x="328" y="28" width="280" height="8" rx="4" fill="#ea6a34"/><text x="348" y="78" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700">2  Run the checks</text><text x="348" y="112" fill="#ea6a34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700">21 Python tools</text><text x="348" y="156" fill="#3d4a58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17">Rule tables tied to sources:</text><text x="348" y="188" fill="#3d4a58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17">Cap. 123F, FS Code 2011,</text><text x="348" y="220" fill="#3d4a58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17">PNAP, Cap. 131 and more</text><path d="M611 150h14m-6 -6l6 6l-6 6" fill="none" stroke="#6b7682" stroke-width="2.5"/><rect x="632" y="28" width="280" height="244" rx="10" fill="#fff" stroke="#d9dde1"/><rect x="632" y="28" width="280" height="8" rx="4" fill="#1fae7a"/><text x="652" y="78" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700">3  Get draft outputs</text><text x="652" y="112" fill="#1fae7a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700">Markdown, DXF, SVG, IFC</text><text x="652" y="156" fill="#3d4a58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17">PASS / FAIL / CHECK by clause</text><text x="652" y="188" fill="#3d4a58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17">Sketch plans, massing model</text><text x="652" y="220" fill="#3d4a58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17">Deadlines, cost, area schedules</text><path d="M915 150h14m-6 -6l6 6l-6 6" fill="none" stroke="#6b7682" stroke-width="2.5"/><rect x="936" y="28" width="280" height="244" rx="10" fill="#fff" stroke="#d9dde1"/><rect x="936" y="28" width="280" height="8" rx="4" fill="#d6498f"/><text x="956" y="78" fill="#14202e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700">4  AP reviews and signs</text><text x="956" y="112" fill="#d6498f" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700">A person decides</text><text x="956" y="156" fill="#3d4a58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17">Tools never sign or submit</text><text x="956" y="188" fill="#3d4a58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17">Unverified rules are flagged</text><text x="956" y="220" fill="#3d4a58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17">Fix the scheme, then re-run</text></svg>