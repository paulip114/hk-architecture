name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu is pinned because setup-python has no Python 3.9 build for Ubuntu 26.04, the current ubuntu-latest.
          - {os: ubuntu-24.04, python-version: "3.9"}
          - {os: ubuntu-24.04, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the drawing packages
        run: pip install -r requirements-drawing.txt
      - name: Confirm the drawing tests will not be skipped
        run: python -c "import ezdxf, ifcopenshell, shapely, PIL"
      - name: Run the tests
        run: python -m unittest discover -s tests
      - name: Run the BIM tests
        run: python -m unittest discover -s bim/tests
