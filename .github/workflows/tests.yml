name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
        drawing: [true, false]
    name: py${{ matrix.python }}${{ matrix.drawing && ' + drawing' || ' core only' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install drawing packages
        if: matrix.drawing
        run: pip install -r requirements-drawing.txt
      - name: Run tests
        run: python -W ignore -m unittest discover -s tests -v
