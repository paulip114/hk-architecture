name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned because setup-python has no Python 3.9 build for Ubuntu 26.04, the current ubuntu-latest.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the drawing packages
        run: pip install -r requirements-drawing.txt
      - name: Confirm the drawing tests will not be skipped
        run: python -c "import ezdxf, ifcopenshell, shapely, PIL"
      - name: Run the tests
        run: python -m unittest discover -s tests
      - name: Run the BIM tests
        run: python -m unittest discover -s bim/tests
